# At login Toshy can start before GNOME Shell loads window-calls-extended; it then never
# learns the focused app (terminal-specific keys like ⌘V break). Wait up to 30 s for it.
[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 30); do gdbus call --session --dest org.gnome.Shell --object-path /org/gnome/Shell/Extensions/WindowsExt --method org.gnome.Shell.Extensions.WindowsExt.FocusClass >/dev/null 2>&1 && exit 0; sleep 1; done; exit 0'
